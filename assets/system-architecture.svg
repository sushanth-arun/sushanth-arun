<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="880" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Card Background Gradients -->
    <linearGradient id="coreCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162238" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0c1524" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="distCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2238" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#081422" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="aiCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#211538" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#120a22" stop-opacity="0.85" />
    </linearGradient>

    <!-- Circuit Line Gradients -->
    <linearGradient id="lineGradCyan" x1="440" y1="120" x2="225" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <linearGradient id="lineGradPurple" x1="440" y1="120" x2="655" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 700; letter-spacing: 2px; }
    .sub { font-weight: 500; letter-spacing: 1px; }
    .tag { font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
    .hud-title { font-size: 10px; letter-spacing: 3px; font-weight: 700; }
  </style>

  <!-- Outer HUD Frame -->
  <rect x="2" y="2" width="876" height="386" rx="12" fill="url(#bgGrad)" stroke="#1F3A5F" stroke-width="1.5" />

  <!-- Subtle HUD Tech Grid Background -->
  <g stroke="#1F3A5F" stroke-width="0.5" stroke-opacity="0.25">
    <line x1="40" y1="20" x2="840" y2="20" />
    <line x1="40" y1="370" x2="840" y2="370" />
    <line x1="40" y1="20" x2="40" y2="370" />
    <line x1="840" y1="20" x2="840" y2="370" />
    <circle cx="440" cy="195" r="160" fill="none" stroke="#00E5FF" stroke-opacity="0.04" stroke-dasharray="4,4" />
    <circle cx="440" cy="195" r="240" fill="none" stroke="#58A6FF" stroke-opacity="0.03" />
  </g>

  <!-- Decorative HUD Corner Brackets -->
  <!-- Top Left -->
  <path d="M 12 28 L 12 12 L 28 12" stroke="#00E5FF" stroke-width="2.5" fill="none" />
  <!-- Top Right -->
  <path d="M 868 28 L 868 12 L 852 12" stroke="#00E5FF" stroke-width="2.5" fill="none" />
  <!-- Bottom Left -->
  <path d="M 12 362 L 12 378 L 28 378" stroke="#00E5FF" stroke-width="2.5" fill="none" />
  <!-- Bottom Right -->
  <path d="M 868 362 L 868 378 L 852 378" stroke="#00E5FF" stroke-width="2.5" fill="none" />

  <!-- Top HUD Header Bar -->
  <g class="mono">
    <text x="32" y="32" fill="#00E5FF" class="hud-title">JARVIS SYSTEM PROTOCOL // STARK TECH TOPOLOGY</text>
    <circle cx="810" cy="28" r="4" fill="#00E5FF" filter="url(#glowCyan)" />
    <text x="822" y="32" fill="#58A6FF" font-size="10" font-weight="600" letter-spacing="1px">ONLINE</text>
  </g>

  <!-- ========================================================================= -->
  <!-- CENTRAL NODE: SUSHANTH ARUN                                               -->
  <!-- ========================================================================= -->
  <g id="core-node">
    <!-- Outer Glow & Core Card -->
    <rect x="220" y="52" width="440" height="74" rx="8" fill="url(#coreCardGrad)" stroke="#58A6FF" stroke-width="1.8" filter="url(#glowCyan)" />
    
    <!-- Corner Accents on Core Card -->
    <path d="M 224 62 L 224 56 L 230 56" stroke="#00E5FF" stroke-width="2" fill="none" />
    <path d="M 656 62 L 656 56 L 650 56" stroke="#00E5FF" stroke-width="2" fill="none" />
    <path d="M 224 116 L 224 122 L 230 122" stroke="#00E5FF" stroke-width="2" fill="none" />
    <path d="M 656 116 L 656 122 L 650 122" stroke="#00E5FF" stroke-width="2" fill="none" />

    <!-- Core Text -->
    <text x="440" y="80" text-anchor="middle" fill="#FFFFFF" class="mono title" font-size="16">SUSHANTH ARUN</text>
    <text x="440" y="99" text-anchor="middle" fill="#00E5FF" class="sans sub" font-size="12">Computer Science &amp; Cloud Infrastructure Systems Engineer</text>
    <text x="440" y="116" text-anchor="middle" fill="#8B949E" class="mono" font-size="9.5">SYSTEM ARCHITECTURE • DISTRIBUTED CONSENSUS • AGENTIC AI</text>
  </g>

  <!-- ========================================================================= -->
  <!-- CONNECTING HOLOGRAPHIC CIRCUITS                                           -->
  <!-- ========================================================================= -->
  <g stroke-width="2" fill="none">
    <!-- Center to Left Branch -->
    <path d="M 440 126 L 440 148 L 225 148 L 225 170" stroke="url(#lineGradCyan)" />
    <circle cx="225" cy="170" r="3.5" fill="#00E5FF" filter="url(#glowCyan)" />

    <!-- Center to Right Branch -->
    <path d="M 440 126 L 440 148 L 655 148 L 655 170" stroke="url(#lineGradPurple)" />
    <circle cx="655" cy="170" r="3.5" fill="#A855F7" filter="url(#glowPurple)" />

    <!-- Center Junction Pulse Node -->
    <circle cx="440" cy="148" r="4" fill="#58A6FF" filter="url(#glowCyan)" />
  </g>

  <!-- ========================================================================= -->
  <!-- LEFT NODE: DISTRIBUTED SYSTEMS & KERNEL                                    -->
  <!-- ========================================================================= -->
  <g id="dist-systems-node">
    <rect x="35" y="170" width="380" height="175" rx="8" fill="url(#distCardGrad)" stroke="#00E5FF" stroke-width="1.4" stroke-opacity="0.8" />
    
    <!-- Header Badge -->
    <rect x="47" y="182" width="356" height="26" rx="4" fill="#00E5FF" fill-opacity="0.12" stroke="#00E5FF" stroke-width="0.8" />
    <text x="225" y="199" text-anchor="middle" fill="#00E5FF" class="mono title" font-size="11.5">⚡ DISTRIBUTED SYSTEMS &amp; KERNEL</text>

    <!-- Architecture Items -->
    <g class="sans" font-size="11" fill="#E6EDF3">
      <!-- Item 1 -->
      <circle cx="55" cy="226" r="3" fill="#00E5FF" />
      <text x="68" y="230"><tspan font-weight="700" fill="#FFFFFF">Hypervisor &amp; Virtualization:</tspan> <tspan fill="#8B949E">KVM, QEMU, Memory Paging</tspan></text>

      <!-- Item 2 -->
      <circle cx="55" cy="254" r="3" fill="#00E5FF" />
      <text x="68" y="258"><tspan font-weight="700" fill="#FFFFFF">Compiler Design:</tspan> <tspan fill="#8B949E">Lex &amp; YACC, AST Parsing &amp; Optimization</tspan></text>

      <!-- Item 3 -->
      <circle cx="55" cy="282" r="3" fill="#00E5FF" />
      <text x="68" y="286"><tspan font-weight="700" fill="#FFFFFF">Network Protocols:</tspan> <tspan fill="#8B949E">Socket Streams, Botnet Telemetry, IoT-23</tspan></text>

      <!-- Item 4 -->
      <circle cx="55" cy="310" r="3" fill="#00E5FF" />
      <text x="68" y="314"><tspan font-weight="700" fill="#FFFFFF">DevOps Topology:</tspan> <tspan fill="#8B949E">Docker, Kubernetes (k8s), Jenkins CI, Ansible</tspan></text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT NODE: AGENTIC AI & CLOUD ARCHITECTURE                                -->
  <!-- ========================================================================= -->
  <g id="ai-cloud-node">
    <rect x="465" y="170" width="380" height="175" rx="8" fill="url(#aiCardGrad)" stroke="#A855F7" stroke-width="1.4" stroke-opacity="0.8" />
    
    <!-- Header Badge -->
    <rect x="477" y="182" width="356" height="26" rx="4" fill="#A855F7" fill-opacity="0.12" stroke="#A855F7" stroke-width="0.8" />
    <text x="655" y="199" text-anchor="middle" fill="#C084FC" class="mono title" font-size="11.5">🚀 AGENTIC AI &amp; CLOUD ARCHITECTURE</text>

    <!-- Architecture Items -->
    <g class="sans" font-size="11" fill="#E6EDF3">
      <!-- Item 1 -->
      <circle cx="485" cy="226" r="3" fill="#A855F7" />
      <text x="498" y="230"><tspan font-weight="700" fill="#FFFFFF">AWS Cloud Infrastructure:</tspan> <tspan fill="#8B949E">Bedrock, Lambda, VPC, IAM, S3</tspan></text>

      <!-- Item 2 -->
      <circle cx="485" cy="254" r="3" fill="#A855F7" />
      <text x="498" y="258"><tspan font-weight="700" fill="#FFFFFF">Autonomous Agent Workflows:</tspan> <tspan fill="#8B949E">Tool Invocation, Routing &amp; Eval</tspan></text>

      <!-- Item 3 -->
      <circle cx="485" cy="282" r="3" fill="#A855F7" />
      <text x="498" y="286"><tspan font-weight="700" fill="#FFFFFF">Modern Frontend Systems:</tspan> <tspan fill="#8B949E">React, Vite, Tailwind CSS, TypeScript</tspan></text>

      <!-- Item 4 -->
      <circle cx="485" cy="310" r="3" fill="#A855F7" />
      <text x="498" y="314"><tspan font-weight="700" fill="#FFFFFF">Backend &amp; ML Engines:</tspan> <tspan fill="#8B949E">FastAPI, Spring Boot, XGBoost, Scikit-Learn</tspan></text>
    </g>
  </g>

  <!-- Bottom HUD Status Bar -->
  <g class="mono" font-size="9.5" fill="#484F58">
    <text x="40" y="366">STARK INDUSTRIES HUD CORE v4.2</text>
    <text x="440" y="366" text-anchor="middle" fill="#58A6FF">KERNEL • HYPERVISOR • CLOUD INFRASTRUCTURE • AGENTIC SYSTEMS</text>
    <text x="840" y="366" text-anchor="end">ENCRYPTION: 4096-BIT RSA</text>
  </g>
</svg>
